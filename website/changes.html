      const PILL = {
        en: { reversible: "Reversible", permanent: "Permanent", none: "Changes nothing" },
        hu: { reversible: "Visszafordítható", permanent: "Végleges", none: "Semmit nem módosít" },
        de: { reversible: "Umkehrbar", permanent: "Endgültig", none: "Ändert nichts" },
      };

      /* Text from DATA is authored here, but escaping it keeps the renderer
         safe if a future edit ever pastes in something with angle brackets. */
      function esc(s) {
        return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      }

      function render(lang) {
        const d = DATA[lang] || DATA.en;
        const pill = PILL[lang] || PILL.en;
        document.documentElement.lang = lang;
        document.getElementById("pageTitle").textContent = d.title;
        document.getElementById("pageSub").textContent = d.sub;
        document.getElementById("backLink").textContent = d.back;
        document.getElementById("footerHome").textContent = d.home;
        document.getElementById("callout").innerHTML = d.callout;

        document.getElementById("sections").innerHTML = d.sections
          .map(
            (s) => `
            <h2>${esc(s.h)}</h2>
            <p class="sec-sub">${esc(s.sub)}</p>
            ${s.rows
              .map(
                (r) => `
              <div class="row">
                <div class="row-head">
                  <span class="row-title">${esc(r.t)}</span>
                  <span class="pill ${r.v}">${esc(pill[r.v])}</span>
                </div>
                <p class="note">${esc(r.n)}</p>
                ${
                  r.w && r.w.length
                    ? `<ul class="writes">${r.w.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>`
                    : ""
                }
              </div>`,
              )
              .join("")}`,
          )
          .join("");

        document
          .querySelectorAll("#langs button")
          .forEach((b) => b.classList.toggle("active", b.dataset.lang === lang));
        try { localStorage.setItem("bf.site.lang", lang); } catch (e) { /* private mode */ }
      }

      document
        .querySelectorAll("#langs button")
        .forEach((b) => b.addEventListener("click", () => render(b.dataset.lang)));

      let saved = null;
      try { saved = localStorage.getItem("bf.site.lang"); } catch (e) { /* private mode */ }
      const sys = (navigator.language || "en").slice(0, 2);
      render(saved || (["hu", "de"].includes(sys) ? sys : "en"));
    </script>
